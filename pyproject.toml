[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "rental-maintenance-optimization"
version = "0.0.0"
description = "Track A rental maintenance optimization course project"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = ["gurobipy==13.0.3"]

[dependency-groups]
dev = ["editables==0.6", "hatchling==1.33.0", "pytest==9.2.0", "ruff==0.17.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/rental_maintenance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
required-version = "==0.12.19"

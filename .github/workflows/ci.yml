name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.19"
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Check lint
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Verify pip exports match the lock
        run: uv run --locked python scripts/check_requirements.py
      - name: Check repository files
        run: uv run --locked python scripts/check_repository.py
      - name: Test environment and implemented behavior
        run: uv run --locked pytest

  test:
    name: test
    if: always()
    needs: [validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every validation job to succeed
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: test "$VALIDATION_RESULT" = "success"
